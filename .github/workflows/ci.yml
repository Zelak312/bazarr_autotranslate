name: CI

on:
    push:
        branches: [main, head]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: |
                  pip install -r requirements.txt
                  pip install -r requirements-dev.txt

            - name: Lint
              run: ruff check --output-format=github .

            - name: Test
              run: |
                  pytest -q --tb=short > pytest-output.txt 2>&1
                  status=$?
                  cat pytest-output.txt
                  if [ $status -ne 0 ]; then
                      grep -E "^(FAILED|ERROR|E )|failed," pytest-output.txt | head -10 | while IFS= read -r line; do
                          echo "::error::$line"
                      done
                  fi
                  exit $status
